<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Яндекс — быстрый поиск в интернете</title>
  <link rel="icon" href="https://yandex.ru/favicon.ico">
  <link rel="shortcut icon" href="https://yandex.ru/favicon.ico">
  <link rel="stylesheet" href="css/style.css">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    .yandex-frame {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      z-index: 1;
    }
    .notification-stack {
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    @keyframes fadeOut {
      to { opacity: 0; pointer-events: none; }
    }
  </style>
</head>
<body>
  <iframe class="yandex-frame" src="https://yandex.ru/chrome/newtab" id="yandexFrame"></iframe>
  <div class="notification-stack" id="hintStack"></div>
  <script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>
  <script src="js/student.js"></script>
</body>
</html>
