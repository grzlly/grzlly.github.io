<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Яндекс — быстрый поиск в интернете</title>
  <link rel="icon" href="https://yandex.ru/favicon.ico">
  <link rel="shortcut icon" href="https://yandex.ru/favicon.ico">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; font-family: Arial, Helvetica, sans-serif; background: #fff; overflow: hidden; }
    .ya-page {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100%; background: #fff;
    }
    .ya-logo {
      font-size: 48px; font-weight: bold; margin-bottom: 24px; letter-spacing: -1px;
    }
    .ya-logo span { color: #FC3F1D; }
    .ya-search {
      width: 90%; max-width: 580px; position: relative;
    }
    .ya-search input {
      width: 100%; padding: 12px 48px 12px 16px; font-size: 16px;
      border: 2px solid #E5E5E5; border-radius: 12px; outline: none;
      background: #fff; color: #333; transition: border-color 0.2s;
    }
    .ya-search input:focus { border-color: #FFCC00; }
    .ya-search button {
      position: absolute; right: 0; top: 0; height: 100%; padding: 0 20px;
      background: #FFCC00; border: none; border-radius: 0 12px 12px 0;
      font-size: 15px; font-weight: 500; color: #000; cursor: pointer;
    }
    .ya-footer {
      position: absolute; bottom: 12px; color: #999; font-size: 12px;
    }
    .notification-stack {
      position: fixed; bottom: 20px; left: 20px; z-index: 9999;
      display: flex; flex-direction: column; gap: 8px;
    }
    @keyframes fadeOut {
      to { opacity: 0; pointer-events: none; }
    }
  </style>
</head>
<body>
  <div class="ya-page">
    <div class="ya-logo"><span>Я</span>ндекс</div>
    <div class="ya-search">
      <input type="text" placeholder="Найдётся всё" id="searchInput">
      <button onclick="window.open('https://yandex.ru/search/?text='+encodeURIComponent(document.getElementById('searchInput').value))">Найти</button>
    </div>
    <div class="ya-footer">© Яндекс</div>
  </div>
  <div class="notification-stack" id="hintStack"></div>
  <script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>
  <script src="js/student.js"></script>
</body>
</html>
